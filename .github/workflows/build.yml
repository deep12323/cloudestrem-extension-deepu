name: Build Extensions

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Providers
        run: ./gradlew :TelegramProvider:make :GoogleDriveProvider:make :TorrServe:make :ExternalPlayers:make :SkipTorrentWarning:make :PopupBlocker:make

      - name: Generate repo.json and plugins.json
        run: |
          mkdir -p builds

          echo '{
            "name": "cloudestrem-extension-deepu",
            "iconUrl": "https://bollywood.eu.org/favicon.ico",
            "description": "Telegram Extension",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/deep12323/cloudestrem-extension-deepu/builds/plugins.json?v=18"
            ]
          }' > builds/repo.json

          echo '[
            {
              "name": "Telegram",
              "internalName": "TelegramProvider",
              "url": "https://raw.githubusercontent.com/deep12323/cloudestrem-extension-deepu/builds/TelegramProvider.cs3?v=17",
              "tvTypes": ["Movie", "TvSeries"],
              "language": "en",
              "iconUrl": "https://raw.githubusercontent.com/deep12323/cloudestrem-extension-deepu/master/icon.png",
              "apiVersion": 10,
              "version": 167,
              "authors": ["deepu2135"],
              "status": 1,
              "description": "Stream any media from your Telegram chats and channels on-demand"
            },
            {
              "name": "Google Drive",
              "internalName": "GoogleDriveProvider",
              "url": "https://raw.githubusercontent.com/deep12323/cloudestrem-extension-deepu/builds/GoogleDriveProvider.cs3?v=17",
              "tvTypes": ["Movie", "TvSeries"],
              "language": "en",
              "iconUrl": "https://raw.githubusercontent.com/deep12323/cloudestrem-extension-deepu/master/google_drive_icon.png",
              "apiVersion": 10,
              "version": 12,
              "authors": ["deepu2135"],
              "status": 1,
              "description": "Stream video and audio from your Google Drive"
            },
            {
              "name": "TorrServe",
              "internalName": "TorrServe",
              "url": "https://raw.githubusercontent.com/deep12323/cloudestrem-extension-deepu/builds/TorrServe.cs3?v=6",
              "tvTypes": ["Torrent", "Movie", "TvSeries"],
              "language": "en",
              "iconUrl": "https://raw.githubusercontent.com/YouROK/TorrServer/master/server/web/public/favicon.ico",
              "apiVersion": 10,
              "version": 6,
              "authors": ["deepu2135"],
              "status": 1,
              "description": "TorrServer BitTorrent streaming engine with active keep-alive, 40+ high-speed trackers, buffer tuner & seeding controls"
            },
            {
              "name": "External Players (MPV Infinity & 1DM)",
              "internalName": "ExternalPlayers",
              "url": "https://raw.githubusercontent.com/deep12323/cloudestrem-extension-deepu/builds/ExternalPlayers.cs3?v=1",
              "tvTypes": ["Others"],
              "language": "en",
              "iconUrl": "https://raw.githubusercontent.com/google/material-design-icons/master/png/av/play_circle_filled/materialicons/48dp/2x/baseline_play_circle_filled_white_48dp.png",
              "apiVersion": 10,
              "version": 1,
              "authors": ["deepu2135"],
              "status": 1,
              "description": "External player integrations: MPV Infinity (Mpv∞) and 1DM Video Downloader & Player in Preferred video player"
            },
            {
              "name": "Skip Torrent Warning",
              "internalName": "SkipTorrentWarning",
              "url": "https://raw.githubusercontent.com/deep12323/cloudestrem-extension-deepu/builds/SkipTorrentWarning.cs3?v=3",
              "tvTypes": ["Others"],
              "language": "en",
              "iconUrl": "https://raw.githubusercontent.com/google/material-design-icons/master/png/action/visibility_off/materialicons/48dp/2x/baseline_visibility_off_white_48dp.png",
              "apiVersion": 10,
              "version": 3,
              "authors": ["deepu2135"],
              "status": 1,
              "description": "Bypasses 'Stream Torrent' confirmation dialog and shows stream stats in player controls"
            },
            {
              "name": "Popup Blocker",
              "internalName": "PopupBlocker",
              "url": "https://raw.githubusercontent.com/deep12323/cloudestrem-extension-deepu/builds/PopupBlocker.cs3?v=1",
              "tvTypes": ["Others"],
              "language": "en",
              "iconUrl": "https://raw.githubusercontent.com/google/material-design-icons/master/png/action/shield/materialicons/48dp/2x/baseline_shield_white_48dp.png",
              "apiVersion": 10,
              "version": 1,
              "authors": ["deepu2135"],
              "status": 1,
              "description": "Hides and blocks donation popups, ads, and support banners across all Cloudstream extensions (e.g. CNCVerse)"
            }
          ]' > builds/plugins.json

      - name: Push to builds branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin
          git checkout -B builds
          git rm -rf .github/ || true
          cp -r builds/. .
          git add -f repo.json plugins.json *.cs3 || true
          git status
          git commit -m "Update builds" || true
          git push origin builds --force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramProvider
          path: builds/
